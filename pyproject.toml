[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-research-agent-lab"
version = "0.1.0"
description = "A learning project for deep film research using AI agents, source retrieval, RAG and evidence-based synthesis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.10.0",
    "litellm==1.101.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
